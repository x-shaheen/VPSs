name: T-Cloud Ephemeral Engine

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Initialize Cloud Server
      run: |
        set -e
        sudo systemctl start docker
        sudo systemctl enable docker
        sudo apt-get update && sudo apt-get install -y curl

    - name: Install Cloudflare Tunnel
      run: |
        set -e
        curl -L --output cloudflared.deb https://github.com
        sudo dpkg -i cloudflared.deb

    - name: Start Cloudflare Tunnel
      env:
        TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
      run: |
        set -e
        if [ -z "$TUNNEL_TOKEN" ]; then
          echo "❌ خطأ: لم يتم العثور على CLOUDFLARE_TUNNEL_TOKEN في جيت هاب Secrets!"
          exit 1
        fi
        echo "🚀 جاري تشغيل النفق مباشرة في الخلفية..."
        sudo nohup cloudflared tunnel run --token "$TUNNEL_TOKEN" > cloudflared.log 2>&1 &
        sleep 5
        echo "=== مخرجات فحص تشغيل النفق ==="
        cat cloudflared.log || true

    - name: Keep Server Alive
      env:
        TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
      run: |
        echo "=========================================="
        echo " 🔥 الخادم السحابي يعمل الآن بكفاءة خارقة 🔥 "
        echo "=========================================="
        
        for i in {1..350}; do
          echo "⏰ نبض السيرفر مستمر... $(date)"
          
          if ! pgrep cloudflared > /dev/null; then
            echo "⚠️ إعادة تشغيل النفق..."
            sudo nohup cloudflared tunnel run --token "$TUNNEL_TOKEN" > cloudflared.log 2>&1 &
          fi
          sleep 60
        done

    - name: Cleanup
      if: always()
      run: |
        sudo pkill cloudflared 2>/dev/null || true
        
