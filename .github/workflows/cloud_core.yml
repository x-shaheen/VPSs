name: T-Cloud Ephemeral Engine

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *' # إعادة تشغيل أوتوماتيكية كل 6 ساعات لضمان عمل السيرفر بلا انقطاع

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # أقصى مدة تشغيل مدعومة للجلسة الواحدة

    steps:
    - name: Initialize Cloud Server
      run: |
        set -e
        echo "=========================================="
        echo "🚀 بدء تهيئة النواة وتفعيل خدمة Docker..."
        echo "=========================================="
        sudo systemctl start docker
        sudo systemctl enable docker
        
        echo "تثبيت الأدوات المساعدة المطلوبة..."
        sudo apt-get update && sudo apt-get install -y curl tmux

    - name: Install Cloudflare Tunnel
      run: |
        set -e
        echo "جاري تحميل أداة النفق الآمنة من كلود فلير..."
        curl -L --output cloudflared.deb https://github.com
        
        echo "تثبيت الحزمة على نظام الخادم الخام..."
        sudo dpkg -i cloudflared.deb
        
        echo "التحقق من إصدار أداة النفق:"
        cloudflared --version

    - name: Start Cloudflare Tunnel
      env:
        TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
      run: |
        set -e
        if [ -z "$TUNNEL_TOKEN" ]; then
          echo "❌ خطأ أمني: لم يتم العثور على CLOUDFLARE_TUNNEL_TOKEN في GitHub Secrets!"
          exit 1
        fi
        
        echo "🚀 جاري إطلاق النفق المشفر للاتصال بكلود فلير..."
        sudo nohup cloudflared tunnel run --token "$TUNNEL_TOKEN" > cloudflared.log 2>&1 &
        
        sleep 5
        echo "=== مخرجات التحقق الأولية من سجلات النفق ==="
        cat cloudflared.log || true

    - name: Keep Server Alive & Active Engine
      env:
        TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
      run: |
        echo "=========================================="
        echo " 🔥 الخادم السحابي الخام نشط ومتصل الآن 🔥 "
        echo "=========================================="
        echo "المواصفات: بيئة Ubuntu مع تشغيل كامل لـ Docker"
        echo "=========================================="
        
        # حلقة تكرار ذكية لمراقبة استقرار النفق وإبقاء السيرفر حياً
        for i in {1..350}; do
          echo "⏰ نبض السيرفر مستمر بنجاح... الوقت الحالي: $(date)"
          
          # التحقق التلقائي للتأكد من عدم توقف عملية النفق بالخطأ
          if ! pgrep cloudflared > /dev/null; then
            echo "⚠️ تنبيه: تم رصد توقف النفق. جاري إعادة التشغيل الفوري..."
            sudo nohup cloudflared tunnel run --token "$TUNNEL_TOKEN" > cloudflared.log 2>&1 &
          fi
          
          sleep 60
        done

    - name: Safe Cleanup
      if: always()
      run: |
        echo "تنظيف وإغلاق الجلسة السحابية بأمان..."
        sudo pkill cloudflared 2>/dev/null || true
        
