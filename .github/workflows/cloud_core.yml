      - name: Keep Server Alive
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}

        run: |
          set -u

          LOG_FILE="$GITHUB_WORKSPACE/cloudflared.log"
          PID_FILE="$GITHUB_WORKSPACE/cloudflared.pid"

          echo "=========================================="
          echo "🔥 T-Cloud Ephemeral Engine"
          echo "🔥 الخادم السحابي نشط"
          echo "🔥 Cloudflare Tunnel يعمل"
          echo "=========================================="

          start_tunnel() {
            echo ""
            echo "=========================================="
            echo "🚀 تشغيل Cloudflare Tunnel..."
            echo "=========================================="

            sudo nohup cloudflared tunnel run \
              --token "$TUNNEL_TOKEN" \
              >> "$LOG_FILE" 2>&1 &

            NEW_PID=$!

            echo "$NEW_PID" > "$PID_FILE"

            echo "🆔 Cloudflared PID: $NEW_PID"

            sleep 10

            if sudo kill -0 "$NEW_PID" 2>/dev/null; then
              echo "✅ عملية Cloudflare Tunnel تعمل."
              return 0
            fi

            echo "❌ فشل تشغيل Cloudflare Tunnel."

            echo ""
            echo "========== CLOUDFLARED LOG =========="
            sudo tail -n 100 "$LOG_FILE" || true
            echo "======================================"

            return 1
          }

          # ----------------------------------------------------------
          # Main Keep-Alive Loop
          # ----------------------------------------------------------

          for i in $(seq 1 350); do

            CURRENT_TIME="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

            echo ""
            echo "=========================================="
            echo "⏰ [$CURRENT_TIME]"
            echo "💓 نبض السيرفر: $i / 350"
            echo "=========================================="

            # --------------------------------------------------------
            # Cloudflare Tunnel Check
            # --------------------------------------------------------

            TUNNEL_RUNNING=false

            if [ -f "$PID_FILE" ]; then

              CLOUDFLARED_PID="$(cat "$PID_FILE")"

              if sudo kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
                TUNNEL_RUNNING=true
                echo "✅ Cloudflare Tunnel process: RUNNING"
                echo "🆔 PID: $CLOUDFLARED_PID"
              else
                echo "⚠️ Cloudflare Tunnel process: STOPPED"
              fi

            else

              echo "⚠️ PID file غير موجود."

            fi

            # --------------------------------------------------------
            # Restart Tunnel if Necessary
            # --------------------------------------------------------

            if [ "$TUNNEL_RUNNING" = false ]; then

              echo "🔄 محاولة إعادة تشغيل Cloudflare Tunnel..."

              if start_tunnel; then
                echo "✅ تمت إعادة تشغيل النفق بنجاح."
              else
                echo "⚠️ تعذر تشغيل النفق في هذه المحاولة."
                echo "⏳ سيتم الانتظار ثم المحاولة مرة أخرى."

                sleep 30
                continue
              fi

            fi

            # --------------------------------------------------------
            # Docker Check
            # --------------------------------------------------------

            if sudo systemctl is-active --quiet docker; then

              echo "🐳 Docker: RUNNING"

            else

              echo "⚠️ Docker: STOPPED"
              echo "🔄 إعادة تشغيل Docker..."

              sudo systemctl start docker

              if sudo systemctl is-active --quiet docker; then
                echo "✅ Docker عاد للعمل."
              else
                echo "❌ تعذر تشغيل Docker."
              fi

            fi

            # --------------------------------------------------------
            # Show Recent Tunnel Logs
            # --------------------------------------------------------

            if [ -f "$LOG_FILE" ]; then

              echo ""
              echo "📡 آخر حالة من Cloudflare Tunnel:"
              sudo tail -n 5 "$LOG_FILE" || true

            fi

            # --------------------------------------------------------
            # Wait Before Next Check
            # --------------------------------------------------------

            echo ""
            echo "⏳ الانتظار 60 ثانية قبل الفحص التالي..."

            sleep 60

          done

          echo ""
          echo "=========================================="
          echo "⏱️ انتهت دورة التشغيل."
          echo "=========================================="
