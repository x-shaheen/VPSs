name: T-Cloud Ephemeral Engine

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 */6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Initialize Cloud Server
        run: |
          set -e
          echo "Starting Pre-installed Docker Service..."
          sudo systemctl start docker
          sudo systemctl enable docker
          
          echo "Installing required utility packages..."
          sudo apt-get update && sudo apt-get install -y tmux curl

      - name: Install Cloudflare Tunnel
        run: |
          set -e

          echo "Downloading cloudflared..."

          curl -L \
            --fail \
            --silent \
            --show-error \
            -o cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb

          echo "Installing cloudflared..."

          sudo dpkg -i cloudflared.deb

          echo "Cloudflared version:"
          cloudflared --version

      - name: Start Cloudflare Tunnel
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          set -e

          if [ -z "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
            echo "ERROR: CLOUDFLARE_TUNNEL_TOKEN is not configured."
            exit 1
          fi

          echo "Starting Cloudflare Tunnel..."

          tmux new-session -d -s cloudflare-tunnel \
            "cloudflared tunnel run --token '$CLOUDFLARE_TUNNEL_TOKEN'"

          sleep 10

          echo "Tunnel process:"
          pgrep -a cloudflared || true

      - name: Start Cloud Server
        run: |
          echo "======================================"
          echo "T-Cloud Ephemeral Engine"
          echo "Cloud server is now running."
          echo "======================================"

          echo "Docker status:"
          sudo systemctl --no-pager status docker || true

      - name: Keep Server Alive
        run: |
          echo "Server will remain active for up to 6 hours."

          for i in $(seq 1 360); do
            echo "[$(date -u '+%Y-%m-%d %H:%M:%S UTC')] Server is running..."

            if ! pgrep -x cloudflared > /dev/null; then
              echo "ERROR: Cloudflare Tunnel stopped."
              exit 1
            fi

            sleep 60
          done

      - name: Cleanup
        if: always()
        run: |
          echo "Stopping Cloudflare Tunnel..."

          tmux kill-session -t cloudflare-tunnel 2>/dev/null || true
          sudo pkill cloudflared 2>/dev/null || true

          echo "Cleanup completed."
