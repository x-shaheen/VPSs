name: T-Cloud Ephemeral Server

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    - cron: "0 */6 * * *"

jobs:
  cloud-server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Initialize Cloud Server
        run: |
          set -e

          echo "=========================================="
          echo "       T-CLOUD EPHEMERAL SERVER"
          echo "=========================================="

          sudo systemctl start docker
          sudo systemctl enable docker

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            ca-certificates \
            git

          echo ""
          echo "Docker:"
          docker --version

          echo ""
          echo "Docker Status:"
          sudo systemctl is-active docker

          echo ""
          echo "Server initialized successfully."

      - name: Install Cloudflare Tunnel
        run: |
          set -e

          echo "=========================================="
          echo "       INSTALLING CLOUDFLARE"
          echo "=========================================="

          curl -L \
            --fail \
            --retry 5 \
            -o /tmp/cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb

          sudo dpkg -i /tmp/cloudflared.deb

          echo ""
          cloudflared --version

      - name: Build Cloud Server
        run: |
          set -e

          echo "=========================================="
          echo "       BUILDING CLOUD SERVER"
          echo "=========================================="

          docker build \
            -t t-cloud-server:latest \
            .

          echo ""
          echo "Docker image built successfully."

      - name: Start Cloud Server
        run: |
          set -e

          echo "=========================================="
          echo "       STARTING CLOUD SERVER"
          echo "=========================================="

          docker rm -f t-cloud-server 2>/dev/null || true

          docker volume create t-cloud-data 2>/dev/null || true

          docker run -d \
            --name t-cloud-server \
            --restart unless-stopped \
            -p 2222:22 \
            -p 8080:8080 \
            -v t-cloud-data:/workspace \
            t-cloud-server:latest

          echo ""
          echo "Container status:"
          docker ps

          echo ""
          echo "Cloud server started successfully."

      - name: Start Cloudflare Tunnel
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          set -e

          echo "=========================================="
          echo "       STARTING CLOUDFLARE TUNNEL"
          echo "=========================================="

          if [ -z "$TUNNEL_TOKEN" ]; then
            echo "ERROR: CLOUDFLARE_TUNNEL_TOKEN is missing."
            exit 1
          fi

          LOG_FILE="$GITHUB_WORKSPACE/cloudflared.log"

          rm -f "$LOG_FILE"

          sudo nohup cloudflared tunnel run \
            --token "$TUNNEL_TOKEN" \
            > "$LOG_FILE" 2>&1 &

          PID=$!

          echo "$PID" > "$GITHUB_WORKSPACE/cloudflared.pid"

          echo "Cloudflare PID: $PID"

          sleep 10

          if sudo kill -0 "$PID" 2>/dev/null; then
            echo "Cloudflare Tunnel: RUNNING"
          else
            echo "ERROR: Cloudflare Tunnel failed."

            echo ""
            echo "========== CLOUDFLARED LOG =========="

            sudo tail -n 100 "$LOG_FILE" || true

            echo "======================================"

            exit 1
          fi

      - name: Show Server Information
        run: |
          echo ""
          echo "=========================================="
          echo "       T-CLOUD SERVER READY"
          echo "=========================================="

          echo ""
          echo "Hostname:"
          hostname

          echo ""
          echo "CPU:"
          nproc

          echo ""
          echo "Memory:"
          free -h

          echo ""
          echo "Disk:"
          df -h /

          echo ""
          echo "Docker:"
          docker ps

          echo ""
          echo "=========================================="
          echo " Cloudflare Domain:"
          echo " https://shaheen94s.mooo.com"
          echo "=========================================="

      - name: Keep Server Alive
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          set -u

          LOG_FILE="$GITHUB_WORKSPACE/cloudflared.log"
          PID_FILE="$GITHUB_WORKSPACE/cloudflared.pid"

          echo ""
          echo "=========================================="
          echo "       T-CLOUD ENGINE ACTIVE"
          echo "=========================================="

          for i in $(seq 1 330); do

            echo ""
            echo "------------------------------------------"
            echo "Heartbeat: $i / 330"
            echo "Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "------------------------------------------"

            # Cloudflare Tunnel
            if [ -f "$PID_FILE" ]; then

              PID="$(cat "$PID_FILE")"

              if sudo kill -0 "$PID" 2>/dev/null; then

                echo "Cloudflare Tunnel: RUNNING"
                echo "PID: $PID"

              else

                echo "Cloudflare Tunnel: STOPPED"
                echo "Restarting Tunnel..."

                sudo nohup cloudflared tunnel run \
                  --token "$TUNNEL_TOKEN" \
                  >> "$LOG_FILE" 2>&1 &

                NEW_PID=$!

                echo "$NEW_PID" > "$PID_FILE"

                sleep 10

                if sudo kill -0 "$NEW_PID" 2>/dev/null; then
                  echo "Cloudflare Tunnel restarted."
                  echo "New PID: $NEW_PID"
                else
                  echo "WARNING: Tunnel restart failed."
                fi

              fi

            else

              echo "WARNING: PID file missing."

            fi

            # Docker
            if sudo systemctl is-active --quiet docker; then

              echo "Docker: RUNNING"

            else

              echo "Docker: STOPPED"
              echo "Starting Docker..."

              sudo systemctl start docker

            fi

            # Container
            if docker ps --format '{{.Names}}' | grep -q "^t-cloud-server$"; then

              echo "Cloud Container: RUNNING"

            else

              echo "Cloud Container: STOPPED"
              echo "Restarting container..."

              docker start t-cloud-server 2>/dev/null || true

            fi

            echo ""
            echo "Waiting 60 seconds..."

            sleep 60

          done

      - name: Diagnostics
        if: always()
        run: |
          echo "=========================================="
          echo "       T-CLOUD DIAGNOSTICS"
          echo "=========================================="

          echo ""
          echo "Docker containers:"
          docker ps -a || true

          echo ""
          echo "Cloud server logs:"
          docker logs --tail 100 t-cloud-server 2>/dev/null || true

          echo ""
          echo "Cloudflare logs:"
          sudo tail -n 100 cloudflared.log 2>/dev/null || true

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up..."

          sudo pkill -x cloudflared 2>/dev/null || true

          docker stop t-cloud-server 2>/dev/null || true

          echo "Cleanup completed."
