name: T-Cloud Ephemeral Engine

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Initialize Cloud Server
      run: |
        set -e
        echo "=========================================="
        echo "🚀 بدء تهيئة النواة وتفعيل خدمة Docker..."
        echo "=========================================="
        sudo systemctl start docker
        sudo systemctl enable docker
        sudo apt-get update && sudo apt-get install -y curl tmux

    - name: Install Cloudflare Tunnel (Official Repository)
      run: |
        set -e
        echo "تثبيت مستودع كلود فلير الرسمي والآمن..."
        sudo mkdir -p /usr/share/keyrings
        curl -fsSL https://cloudflare.com | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
        
        echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://cloudflare.com jammy main" | sudo tee /etc/apt/sources.list.d/cloudflared.list
        
        echo "تحديث حزم النظام وتثبيت أداة cloudflared..."
        sudo apt-get update && sudo apt-get install -y cloudflared
        
        echo "التحقق من نجاح التثبيت البرمجي:"
        cloudflared --version

    - name: Start Cloudflare Tunnel
      env:
        TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
      run: |
        set -e
        if [ -z "$TUNNEL_TOKEN" ]; then
          echo "❌ خطأ أمني: لم يتم العثور على CLOUDFLARE_TUNNEL_TOKEN في GitHub Secrets!"
          exit 1
        fi
        
        echo "🚀 جاري إطلاق النفق المشفر للاتصال بكلود فلير..."
        sudo nohup cloudflared tunnel run --token "$TUNNEL_TOKEN" > cloudflared.log 2>&1 &
        
        sleep 5
        echo "=== مخرجات التحقق الأولية من سجلات النفق ==="
        cat cloudflared.log || true

    - name: Keep Server Alive & Active Engine
      env:
        TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
      run: |
        echo "=========================================="
        echo " 🔥 الخادم السحابي الخام نشط ومتصل الآن 🔥 "
        echo "=========================================="
        
        for i in {1..350}; do
          echo "⏰ نبض السيرفر مستمر بنجاح... الوقت الحالي: $(date)"
          
          if ! pgrep cloudflared > /dev/null; then
            echo "⚠️ تنبيه: تم رصد توقف النفق. جاري إعادة التشغيل الفوري..."
            sudo nohup cloudflared tunnel run --token "$TUNNEL_TOKEN" > cloudflared.log 2>&1 &
          fi
          
          sleep 60
        done

    - name: Safe Cleanup
      if: always()
      run: |
        echo "تنظيف وإغلاق الجلسة السحابية بأمان..."
        sudo pkill cloudflared 2>/dev/null || true
        
